name: Build Komikta APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    shell: bash
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew assembleDebug
      elif [ -f komiktaandroid/gradlew ]; then
        cd komiktaandroid
        chmod +x gradlew
        ./gradlew assembleDebug
      elif [ -f settings.gradle.kts ] && [ -d app ]; then
        gradle assembleDebug
      elif [ -f komiktaandroid/settings.gradle.kts ]; then
        cd komiktaandroid
        gradle assembleDebug
      else
        echo "Project Android tidak ditemukan"
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Komikta-APK
      path: |
        app/build/outputs/apk/debug/*.apk
        komiktaandroid/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
