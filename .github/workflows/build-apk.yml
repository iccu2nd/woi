name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL backend (wajib pakai trailing slash, contoh https://domain.com/)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          ARGS=""
          if [ -n "$API_URL" ]; then
            ARGS="-PKOMIKTA_API_BASE_URL=$API_URL"
          fi
          gradle assembleDebug $ARGS --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
