name: Build Komikta APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Find Android Project
    id: project
    shell: bash
    run: |
      if [ -f "gradlew" ]; then
        echo "dir=." >> "$GITHUB_OUTPUT"
      elif [ -f "komiktaandroid/gradlew" ]; then
        echo "dir=komiktaandroid" >> "$GITHUB_OUTPUT"
      elif [ -f "settings.gradle.kts" ] && [ -d "app" ]; then
        echo "dir=." >> "$GITHUB_OUTPUT"
      elif [ -f "komiktaandroid/settings.gradle.kts" ] && [ -d "komiktaandroid/app" ]; then
        echo "dir=komiktaandroid" >> "$GITHUB_OUTPUT"
      else
        echo "Android project not found."
        echo "Check the repository root and project folder."
        exit 1
      fi

  - name: Build Debug APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Komikta-APK
      path: |
        ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
